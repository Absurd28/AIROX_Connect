name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Also checks gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build the debug APK and run lint
        run: ./gradlew assembleDebug lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: airox-connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    # Only the self-contained tests in UnitTests.kt. E2E, Tour and StrongConfirm need a paired AIRUX PC.
    name: Unit tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UnitTests.kt
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.airux.connect.PairLinkTest,org.airux.connect.PinTest,org.airux.connect.LanTest,org.airux.connect.WavTest,org.airux.connect.H264Test,org.airux.connect.TranscriptTest

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
